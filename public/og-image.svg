<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- background -->
  <rect width="1200" height="630" fill="#05060a"/>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <pattern id="gridMajor" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="rgba(118,185,0,0.06)" stroke-width="1"/>
    </pattern>
    <radialGradient id="bloom" cx="30%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#76B900" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#76B900" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#gridMajor)"/>
  <rect width="1200" height="630" fill="url(#bloom)"/>

  <!-- corner brackets -->
  <path d="M40 40 L80 40 M40 40 L40 80" stroke="#76B900" stroke-width="3"/>
  <path d="M1160 40 L1120 40 M1160 40 L1160 80" stroke="#76B900" stroke-width="3"/>
  <path d="M40 590 L80 590 M40 590 L40 550" stroke="#76B900" stroke-width="3"/>
  <path d="M1160 590 L1120 590 M1160 590 L1160 550" stroke="#76B900" stroke-width="3"/>

  <!-- top telemetry bar -->
  <line x1="80" y1="110" x2="200" y2="110" stroke="#76B900" stroke-width="2"/>
  <text x="220" y="116" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#76B900" letter-spacing="3">PORTFOLIO / v2.0</text>
  <text x="1020" y="116" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#858ca1" letter-spacing="3">● LIVE</text>

  <!-- title -->
  <text x="80" y="260" font-family="Space Grotesk, system-ui, sans-serif" font-size="96" font-weight="700" fill="#ffffff" letter-spacing="-2">Ryan Huang</text>
  <text x="80" y="330" font-family="Space Grotesk, system-ui, sans-serif" font-size="48" font-weight="500" fill="#c8ccd9">Robotics Product Manager</text>

  <!-- tagline -->
  <text x="80" y="390" font-family="ui-monospace, Menlo, monospace" font-size="24" fill="#565d73">$ </text>
  <text x="108" y="390" font-family="ui-monospace, Menlo, monospace" font-size="24" fill="#76B900">ships_product = </text>
  <text x="320" y="390" font-family="ui-monospace, Menlo, monospace" font-size="24" fill="#ffffff">writes_code()</text>
  <text x="486" y="390" font-family="ui-monospace, Menlo, monospace" font-size="24" fill="#76B900">_</text>

  <line x1="80" y1="440" x2="1120" y2="440" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <g font-family="ui-monospace, Menlo, monospace" font-size="16" letter-spacing="2">
    <text x="80"  y="490" fill="#858ca1">EDU</text>
    <text x="80"  y="520" fill="#ffffff" font-size="20">UCLA Anderson MBA</text>

    <text x="400" y="490" fill="#858ca1">BUILDS</text>
    <text x="400" y="520" fill="#ffffff" font-size="20">ROS 2 · Jetson · MPC</text>

    <text x="720" y="490" fill="#858ca1">FOCUS</text>
    <text x="720" y="520" fill="#76B900" font-size="20">F1TENTH Autonomous Racing</text>
  </g>

  <line x1="80" y1="560" x2="1120" y2="560" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <text x="80" y="590" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#565d73" letter-spacing="2">// ryanxhuang.com</text>
  <text x="950" y="590" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#76B900" letter-spacing="2">TARGET :: NVIDIA_ROBOTICS</text>
</svg>
